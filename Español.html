<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>METAOUR - Corredor Espacial</title>
<style>
  body {
    margin:0; height:100vh; background:#0a0e17; font-family:Arial,Helvetica,sans-serif;
    overflow:hidden; color:#00ffea;
  }
  canvas {
    display:block; margin:0 auto; image-rendering:pixelated;
  }
  #ui {
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    font-size:28px; text-shadow:0 0 10px #00ffea; pointer-events:none; z-index:5;
  }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    background:rgba(10,14,23,0.85); z-index:10; pointer-events:none;
  }
  #title { font-size:80px; text-shadow:0 0 20px #ff2a6d, 0 0 40px #00ffea; margin:0; }
  #subtitle { font-size:32px; margin:10px 0 30px; text-shadow:0 0 15px #00ffea; }
  #countdown { font-size:120px; font-weight:bold; text-shadow:0 0 30px #ff2a6d; }
  #instructions { font-size:28px; margin-top:40px; }
  #game-over {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#ff2a6d; font-size:70px; text-align:center; display:none;
    text-shadow:0 0 20px #ff2a6d; z-index:15;
  }
  #restart-btn {
    margin-top:30px; padding:15px 40px; font-size:32px;
    background:transparent; border:4px solid #00ffea; color:#00ffea;
    cursor:pointer; display:none;
  }
  #restart-btn:hover { background:rgba(0,255,234,0.1); }

  .metaverse-icon {
    position:fixed; bottom:30px; right:30px; z-index:20; pointer-events:auto;
  }
  .orbit-container {
    position:relative; width:70px; height:70px; cursor:pointer;
  }
  .planet {
    position:absolute; inset:0; margin:auto; width:22px; height:22px; border-radius:50%;
    background: 
      radial-gradient(circle at 25% 25%, #ffffff 8%, transparent 9%),
      radial-gradient(circle at 75% 75%, #00ffea 6%, transparent 7%),
      conic-gradient(#ff2a6d 0deg, #00ffea 100deg, #ff2a6d 200deg, #00ffea 300deg, #ff2a6d 360deg);
    box-shadow:0 0 12px rgba(0,255,234,0.6);
    animation:orbit 6s linear infinite; transition:all 0.2s;
  }
  .orbit-container:hover .planet, .orbit-container:active .planet {
    box-shadow:0 0 20px #00ffea, 0 0 30px rgba(255,42,109,0.4);
    animation-duration:2s; transform:scale(1.1);
  }
  @keyframes orbit { to { transform:rotate(360deg) translateX(24px) rotate(-360deg); } }
</style>
</head>
<body>

<div id="ui">
  METAOUR • Puntuación: <span id="score">0</span> • Máxima: <span id="high-score">0</span>
</div>

<div class="metaverse-icon">
  <a href="https://cybercat.metaour.com/" target="_blank" title="Viaja al Cosmos del Metaverso METAour 🚀">
    <div class="orbit-container"><div class="planet"></div></div>
  </a>
</div>

<div id="overlay">
  <h1 id="title">METAOUR</h1>
  <div id="subtitle">CORREDOR ESPACIAL</div>
  <div id="countdown">3</div>
  <div id="instructions">PRESIONA ESPACIO / TOCA PARA INICIAR</div>
</div>

<div id="game-over">ESTRELLADO<br/>EN EL VACÍO
  <button id="restart-btn">REINICIAR</button>
</div>

<canvas id="game" width="800" height="300"></canvas>

<script>
// ============================================================================
// 1. CONFIGURATION
// ============================================================================
const CONFIG = {
  canvas: { width: 800, height: 300 },
  gravity: 0.8,
  jumpForce: -14,
  baseSpeed: 5.5,
  speedIncrease: 0.0045,
  obstacleFreq: 95,
  groundY: 240,
  player: { x: 90, size: 44 },
  obstacle: { size: 42 },
  starLayers: [
    { count: 80, speedMult: 0.2, size: [0.8, 1.5], alpha: [0.3, 0.6] },
    { count: 50, speedMult: 0.5, size: [1.2, 2.5], alpha: [0.5, 0.8] },
    { count: 30, speedMult: 1.0, size: [1.8, 3.5], alpha: [0.7, 1.0] }
  ],
  countdownMs: 3000
};

const COLORS = {
  bg: '#0a0e17',
  ground: '#1a2a44',
  player: '#00ffea',
  obstacle: '#ff2a6d',
  stars: '#ffffff',
  text: '#00ffea',
  danger: '#ff2a6d'
};

// ============================================================================
// 2. DOM & CONTEXT CACHE
// ============================================================================
const DOM = {
  canvas: document.getElementById('game'),
  ctx: null,
  score: document.getElementById('score'),
  highScore: document.getElementById('high-score'),
  overlay: document.getElementById('overlay'),
  countdown: document.getElementById('countdown'),
  gameOver: document.getElementById('game-over'),
  restartBtn: document.getElementById('restart-btn'),
  metaLink: document.querySelector('.metaverse-icon a')
};

DOM.ctx = DOM.canvas.getContext('2d');

// ============================================================================
// 3. GAME STATE (single source of truth)
// ============================================================================
const GameState = {
  score: 0,
  highScore: parseInt(localStorage.getItem('metaourHighScore') || '0'),
  speed: CONFIG.baseSpeed,
  frame: 0,
  gameOver: false,
  started: false,
  countdownEnd: null,
  now: 0,

  reset() {
    this.score = 0;
    this.speed = CONFIG.baseSpeed;
    this.frame = 0;
    this.gameOver = false;
    this.started = false;
    this.countdownEnd = null;
    Player.reset();
    Obstacles.clear();
    Stars.reset();
    UI.update();
  },

  updateHighScore() {
    const final = Math.floor(this.score);
    if (final > this.highScore) {
      this.highScore = final;
      localStorage.setItem('metaourHighScore', final);
    }
  }
};

// ============================================================================
// 4. ENTITY MODULES
// ============================================================================
const Player = {
  x: CONFIG.player.x,
  y: CONFIG.groundY - CONFIG.player.size,
  vy: 0,
  onGround: true,
  width: CONFIG.player.size,
  height: CONFIG.player.size,

  reset() {
    this.x = CONFIG.player.x;
    this.y = CONFIG.groundY - CONFIG.player.size;
    this.vy = 0;
    this.onGround = true;
  },

  jump() {
    if (this.onGround) {
      this.vy = CONFIG.jumpForce;
      this.onGround = false;
    }
  },

  update() {
    this.vy += CONFIG.gravity;
    this.y += this.vy;
    if (this.y >= CONFIG.groundY - this.height) {
      this.y = CONFIG.groundY - this.height;
      this.vy = 0;
      this.onGround = true;
    }
  },

  draw() {
    DOM.ctx.fillStyle = COLORS.player;
    DOM.ctx.fillRect(this.x, this.y, this.width, this.height);
    DOM.ctx.fillStyle = '#ffffff';
    DOM.ctx.fillRect(this.x + 10, this.y + 10, 24, 8);
    DOM.ctx.fillRect(this.x + 18, this.y + 18, 16, 14);
  }
};

const Obstacles = {
  list: [],

  clear() { this.list = []; },

  add() {
    this.list.push({
      x: CONFIG.canvas.width + 80,
      y: CONFIG.groundY - CONFIG.obstacle.size,
      width: CONFIG.obstacle.size * 0.75,
      height: CONFIG.obstacle.size
    });
  },

  update() {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const o = this.list[i];
      o.x -= GameState.speed;
      if (o.x + o.width < 0) {
        this.list.splice(i, 1);
        continue;
      }
      if (Collision.check(Player, o)) {
        GameState.gameOver = true;
        GameState.updateHighScore();
      }
    }
  },

  draw() {
    this.list.forEach(o => {
      DOM.ctx.fillStyle = COLORS.obstacle;
      DOM.ctx.fillRect(o.x, o.y, o.width, o.height);
      DOM.ctx.fillStyle = '#ff6b9d';
      DOM.ctx.fillRect(o.x + 10, o.y + 10, 22, 22);
    });
  }
};

const Stars = {
  list: [],

  reset() {
    this.list = [];
    CONFIG.starLayers.forEach(layer => {
      for (let i = 0; i < layer.count; i++) {
        this.list.push({
          layer,
          x: Math.random() * (CONFIG.canvas.width + 200) - 100,
          y: Math.random() * CONFIG.canvas.height * 0.9,
          size: Math.random() * (layer.size[1] - layer.size[0]) + layer.size[0],
          baseAlpha: Math.random() * (layer.alpha[1] - layer.alpha[0]) + layer.alpha[0],
          phase: Math.random() * Math.PI * 2
        });
      }
    });
  },

  update() {
    this.list.forEach(s => {
      s.x -= GameState.speed * s.layer.speedMult;
      if (s.x < -s.size * 2) {
        s.x = CONFIG.canvas.width + s.size * 2 + Math.random() * 100;
        s.y = Math.random() * CONFIG.canvas.height * 0.9;
      }
    });
  },

  draw() {
    this.list.forEach(s => {
      const twinkle = Math.sin(GameState.frame * 0.08 + s.phase) * 0.3 + 0.7;
      DOM.ctx.globalAlpha = s.baseAlpha * twinkle;
      DOM.ctx.fillStyle = COLORS.stars;
      DOM.ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    DOM.ctx.globalAlpha = 1;
  }
};

// ============================================================================
// 5. UTILITY MODULES
// ============================================================================
const Collision = {
  check(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }
};

const Spawner = {
  shouldSpawnObstacle() {
    return GameState.frame % CONFIG.obstacleFreq === 0 && Math.random() > 0.2;
  },

  spawn() {
    Obstacles.add();
  }
};

const Countdown = {
  isActive() { return GameState.countdownEnd !== null; },

  start() {
    GameState.countdownEnd = Date.now() + CONFIG.countdownMs;
    let num = 3;
    DOM.countdown.textContent = num;
    const interval = setInterval(() => {
      num--;
      DOM.countdown.textContent = num > 0 ? num : '¡LANZAMIENTO!';
      if (num <= 0) {
        clearInterval(interval);
        setTimeout(() => {
          DOM.overlay.style.display = 'none';
          GameState.started = true;
        }, 800);
      }
    }, 1000);
  },

  update() {
    // handled in interval
  }
};

const UI = {
  update() {
    DOM.score.textContent = Math.floor(GameState.score);
    DOM.highScore.textContent = GameState.highScore;
  },

  showGameOver() {
    DOM.gameOver.style.display = 'block';
    DOM.restartBtn.style.display = 'inline-block';
  }
};

// ============================================================================
// 6. RENDERING LAYERS
// ============================================================================
const Background = {
  draw() {
    DOM.ctx.fillStyle = COLORS.bg;
    DOM.ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

    Stars.draw();

    DOM.ctx.fillStyle = COLORS.ground;
    DOM.ctx.fillRect(0, CONFIG.groundY, CONFIG.canvas.width, CONFIG.canvas.height - CONFIG.groundY);

    // scrolling grid lines
    DOM.ctx.strokeStyle = 'rgba(0,255,234,0.12)';
    DOM.ctx.lineWidth = 1;
    const offset = (GameState.frame * -GameState.speed * 0.7) % 100;
    for (let x = offset; x < CONFIG.canvas.width; x += 100) {
      DOM.ctx.beginPath();
      DOM.ctx.moveTo(x, CONFIG.groundY);
      DOM.ctx.lineTo(x, CONFIG.canvas.height);
      DOM.ctx.stroke();
    }
  }
};

// ============================================================================
// 7. MAIN GAME LOOP
// ============================================================================
function gameLoop(timestamp) {
  GameState.now = timestamp;

  DOM.ctx.clearRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

  if (GameState.gameOver) {
    Background.draw();
    Player.draw();
    Obstacles.draw();
    UI.showGameOver();
  } else {
    if (GameState.started) {
      GameState.score += 0.25;
      GameState.speed += CONFIG.speedIncrease;
      GameState.frame++;

      Player.update();
      Obstacles.update();
      Stars.update();

      if (Spawner.shouldSpawnObstacle()) Spawner.spawn();

      UI.update();
    }

    Background.draw();
    Player.draw();
    Obstacles.draw();
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================================
// 8. INPUT HANDLING
// ============================================================================
function handleInput(e) {
  if (GameState.gameOver) return;

  if (e.code === 'Space' || e.code === 'ArrowUp' || e.type === 'touchstart') {
    e.preventDefault();

    if (!GameState.started && !Countdown.isActive()) {
      Countdown.start();
      return;
    }

    if (GameState.started) {
      Player.jump();
    }
  }
}

// ============================================================================
// 9. INITIALIZATION & EVENT BINDERS
// ============================================================================
function init() {
  Stars.reset();
  UI.update();

  DOM.metaLink.addEventListener('mouseenter', () => {
    // optional hover sound if you add audio later
  });

  window.addEventListener('keydown', handleInput);
  DOM.canvas.addEventListener('touchstart', handleInput);
  DOM.restartBtn.addEventListener('click', () => {
    GameState.reset();
  });

  requestAnimationFrame(gameLoop);
}

init();
</script>
</body>
</html>
