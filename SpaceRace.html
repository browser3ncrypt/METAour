<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>METAOUR - Space Runner</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0a0e17;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    color: #00ffea;
  }
  canvas {
    display: block;
    margin: 0 auto;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(10,14,23,0.85);
    z-index: 10;
    pointer-events: none;
  }
  #title { font-size: 80px; text-shadow: 0 0 20px #ff2a6d, 0 0 40px #00ffea; margin: 0; }
  #subtitle { font-size: 32px; margin: 10px 0 30px; text-shadow: 0 0 15px #00ffea; }
  #countdown { font-size: 120px; font-weight: bold; text-shadow: 0 0 30px #ff2a6d; }
  #instructions { font-size: 28px; margin-top: 40px; }
  .metaverse-icon {
    position: fixed;
    bottom: 30px;
    right: 30px;
    pointer-events: auto;
    z-index: 20;
  }
  .orbit-container {
    position: relative;
    width: 70px;
    height: 70px;
    cursor: pointer;
  }
  .planet {
    position: absolute;
    top: 50%; left: 50%;
    width: 22px; height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 25% 25%, #ffffff 8%, transparent 9%),
      radial-gradient(circle at 75% 75%, #00ffea 6%, transparent 7%),
      conic-gradient(#ff2a6d 0deg, #00ffea 100deg, #ff2a6d 200deg, #00ffea 300deg, #ff2a6d 360deg);
    box-shadow: 0 0 12px rgba(0,255,234,0.6);
    animation: orbit 6s linear infinite;
    image-rendering: pixelated;
    transition: box-shadow 0.2s, transform 0.1s;
  }
  .orbit-container:hover .planet,
  .orbit-container:active .planet {
    box-shadow: 0 0 20px #00ffea, 0 0 30px rgba(255,42,109,0.4);
    animation-duration: 2s;
    transform: scale(1.1);
  }
  @keyframes orbit {
    0% { transform: rotate(0deg) translateX(24px) rotate(0deg); }
    100% { transform: rotate(360deg) translateX(24px) rotate(-360deg); }
  }
  #ui {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    text-shadow: 0 0 10px #00ffea;
    pointer-events: none;
    z-index: 5;
  }
  #game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff2a6d;
    font-size: 70px;
    text-align: center;
    display: none;
    text-shadow: 0 0 20px #ff2a6d;
    z-index: 15;
  }
  #restart-btn {
    margin-top: 30px;
    padding: 15px 40px;
    font-size: 32px;
    background: transparent;
    border: 4px solid #00ffea;
    color: #00ffea;
    cursor: pointer;
    display: none;
  }
  #restart-btn:hover { background: rgba(0,255,234,0.1); }
</style>
</head>
<body>

<div id="ui">
  METAOUR • Score: <span id="score">0</span> • High: <span id="high-score">0</span>
</div>

<div class="metaverse-icon">
  <a href="https://cybercat.metaour.com/" target="_blank" rel="noopener noreferrer" title="Warp to METAour Metaverse Cosmos 🚀">
    <div class="orbit-container">
      <div class="planet"></div>
    </div>
  </a>
</div>

<div id="overlay">
  <h1 id="title">METAOUR</h1>
  <div id="subtitle">SPACE RUNNER</div>
  <div id="countdown">3</div>
  <div id="instructions">PRESS SPACE / TAP TO LAUNCH</div>
</div>

<div id="game-over">
  CRASHED<br/>INTO THE VOID
  <button id="restart-btn">RESTART</button>
</div>

<canvas id="game" width="800" height="300"></canvas>

<script>
// ───────────────────────────────────────────────
// CONFIG & CONSTANTS
// ───────────────────────────────────────────────
const CONFIG = {
  GRAVITY:         0.8,
  JUMP_FORCE:     -14,
  GAME_SPEED:       5.5,
  SPEED_INCREASE:   0.0045,
  OBSTACLE_FREQ:   95,
  GROUND_Y:        240,
  PLAYER_X:         90,
  PLAYER_SIZE:      44,
  OBSTACLE_SIZE:    42,
  STAR_LAYERS: [
    { count: 80,  speedMult: 0.2, sizeMin: 0.8, sizeMax: 1.5, alphaMin: 0.3, alphaMax: 0.6 },
    { count: 50,  speedMult: 0.5, sizeMin: 1.2, sizeMax: 2.5, alphaMin: 0.5, alphaMax: 0.8 },
    { count: 30,  speedMult: 1.0, sizeMin: 1.8, sizeMax: 3.5, alphaMin: 0.7, alphaMax: 1.0 }
  ],
  COUNTDOWN_TIME:  3000
};

const COLORS = {
  bg:        '#0a0e17',
  ground:    '#1a2a44',
  player:    '#00ffea',
  obstacle:  '#ff2a6d',
  stars:     '#ffffff'
};

// ───────────────────────────────────────────────
// AUDIO (jump & crash sounds added)
// ───────────────────────────────────────────────
let audioCtx = null;

function playSound(notes) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  notes.forEach((note, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = note.type || 'square';
    osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime + i * 0.02);

    gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.02);
    gain.gain.linearRampToValueAtTime(note.vol || 0.12, audioCtx.currentTime + i * 0.02 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.02 + note.dur);

    osc.start(audioCtx.currentTime + i * 0.02);
    osc.stop(audioCtx.currentTime + i * 0.02 + note.dur);
  });
}

const JUMP_SOUND = [
  { freq: 880, dur: 0.08, vol: 0.10, type: 'triangle' },
  { freq: 659, dur: 0.12, vol: 0.08, type: 'triangle' }
];

const CRASH_SOUND = [
  { freq: 220, dur: 0.25, vol: 0.20, type: 'sawtooth' },
  { freq: 110, dur: 0.30, vol: 0.15, type: 'sawtooth' },
  { freq: 55,  dur: 0.40, vol: 0.12, type: 'sawtooth' }
];

const HOVER_SOUND = [
  { freq: 523, dur: 0.08, vol: 0.07 },
  { freq: 659, dur: 0.08, vol: 0.07 },
  { freq: 784, dur: 0.12, vol: 0.05 }
];

const CLICK_SOUND = [
  { freq: 65,  dur: 0.25, vol: 0.18, type: 'triangle' },
  { freq: 523, dur: 0.15, vol: 0.12 },
  { freq: 659, dur: 0.15, vol: 0.12 },
  { freq: 784, dur: 0.22, vol: 0.10 }
];

// ───────────────────────────────────────────────
// GAME STATE
// ───────────────────────────────────────────────
const state = {
  score: 0,
  highScore: parseInt(localStorage.getItem('metaourHighScore') || '0'),
  gameSpeed: CONFIG.GAME_SPEED,
  frameCount: 0,
  gameOver: false,
  started: false,
  countdown: null
};

// ───────────────────────────────────────────────
// ENTITIES
// ───────────────────────────────────────────────
class Player {
  constructor() {
    this.x = CONFIG.PLAYER_X;
    this.y = CONFIG.GROUND_Y - CONFIG.PLAYER_SIZE;
    this.vy = 0;
    this.onGround = true;
    this.width  = CONFIG.PLAYER_SIZE;
    this.height = CONFIG.PLAYER_SIZE;
  }

  jump() {
    if (this.onGround) {
      this.vy = CONFIG.JUMP_FORCE;
      this.onGround = false;
      playSound(JUMP_SOUND);
    }
  }

  update() {
    this.vy += CONFIG.GRAVITY;
    this.y += this.vy;
    if (this.y >= CONFIG.GROUND_Y - this.height) {
      this.y = CONFIG.GROUND_Y - this.height;
      this.vy = 0;
      this.onGround = true;
    }
  }

  draw(ctx) {
    ctx.fillStyle = COLORS.player;
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(this.x + 10, this.y + 10, 24, 8);
    ctx.fillRect(this.x + 18, this.y + 18, 16, 14);
  }
}

class Obstacle {
  constructor(x) {
    this.x = x;
    this.y = CONFIG.GROUND_Y - CONFIG.OBSTACLE_SIZE;
    this.width  = CONFIG.OBSTACLE_SIZE * 0.75;
    this.height = CONFIG.OBSTACLE_SIZE;
  }

  update() { this.x -= state.gameSpeed; }

  draw(ctx) {
    ctx.fillStyle = COLORS.obstacle;
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.fillStyle = '#ff6b9d';
    ctx.fillRect(this.x + 10, this.y + 10, 22, 22);
    ctx.fillRect(this.x + 20, this.y + 20, 16, 16);
  }

  isOffScreen() { return this.x + this.width < 0; }
}

class ParallaxStar {
  constructor(layer) {
    this.layer = layer;
    this.x = Math.random() * (canvas.width + 200) - 100;
    this.y = Math.random() * canvas.height * 0.9;
    this.size = Math.random() * (layer.sizeMax - layer.sizeMin) + layer.sizeMin;
    this.baseAlpha = Math.random() * (layer.alphaMax - layer.alphaMin) + layer.alphaMin;
    this.twinklePhase = Math.random() * Math.PI * 2;
  }

  update() {
    this.x -= state.gameSpeed * this.layer.speedMult;
    if (this.x < -this.size * 2) {
      this.x = canvas.width + this.size * 2 + Math.random() * 100;
      this.y = Math.random() * canvas.height * 0.9;
    }
  }

  draw(ctx) {
    const twinkle = Math.sin(state.frameCount * 0.08 + this.twinklePhase) * 0.3 + 0.7;
    ctx.globalAlpha = this.baseAlpha * twinkle;
    ctx.fillStyle = COLORS.stars;
    ctx.fillRect(this.x, this.y, this.size, this.size);
    ctx.globalAlpha = 1;
  }
}

// ───────────────────────────────────────────────
// ELEMENTS
// ───────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const overlay = document.getElementById('overlay');
const countdownEl = document.getElementById('countdown');
const gameOverEl = document.getElementById('game-over');
const restartBtn = document.getElementById('restart-btn');
const metaverseLink = document.querySelector('.metaverse-icon a');

let player = new Player();
let obstacles = [];
let stars = []; // now array of ParallaxStar
let groundX = 0;

// ───────────────────────────────────────────────
// HELPERS
// ───────────────────────────────────────────────
function resetGame() {
  state.score = 0;
  state.gameSpeed = CONFIG.GAME_SPEED;
  state.frameCount = 0;
  state.gameOver = false;
  state.started = false;
  state.countdown = null;

  player = new Player();
  obstacles = [];
  groundX = 0;

  // Re-init stars on reset
  stars = [];
  CONFIG.STAR_LAYERS.forEach(layer => {
    for (let i = 0; i < layer.count; i++) {
      stars.push(new ParallaxStar(layer));
    }
  });

  overlay.style.display = 'flex';
  countdownEl.textContent = '3';
  gameOverEl.style.display = 'none';
  restartBtn.style.display = 'none';

  updateUI();
}

function startCountdown() {
  if (state.countdown) return;
  state.countdown = Date.now() + CONFIG.COUNTDOWN_TIME;
  let num = 3;
  const interval = setInterval(() => {
    num--;
    countdownEl.textContent = num > 0 ? num : 'LAUNCH!';
    if (num <= 0) {
      clearInterval(interval);
      setTimeout(() => {
        overlay.style.display = 'none';
        state.started = true;
      }, 800);
    }
  }, 1000);
}

function spawnObstacle() {
  if (state.frameCount % CONFIG.OBSTACLE_FREQ === 0 && Math.random() > 0.2) {
    obstacles.push(new Obstacle(canvas.width + 80));
  }
}

function updateObstacles() {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.update();
    if (obs.isOffScreen()) {
      obstacles.splice(i, 1);
      continue;
    }
    if (checkCollision(player, obs)) {
      state.gameOver = true;
      playSound(CRASH_SOUND);
      if (Math.floor(state.score) > state.highScore) {
        state.highScore = Math.floor(state.score);
        localStorage.setItem('metaourHighScore', state.highScore);
        updateUI();
      }
    }
  }
}

function checkCollision(a, b) {
  return a.x < b.x + b.width &&
         a.x + a.width > b.x &&
         a.y < b.y + b.height &&
         a.y + a.height > b.y;
}

function drawBackground() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Parallax stars (drawn in order: far → near)
  stars.forEach(star => {
    star.update();
    star.draw(ctx);
  });

  ctx.fillStyle = COLORS.ground;
  ctx.fillRect(0, CONFIG.GROUND_Y, canvas.width, canvas.height - CONFIG.GROUND_Y);

  ctx.strokeStyle = 'rgba(0, 255, 234, 0.12)';
  ctx.lineWidth = 1;
  for (let x = (groundX % 100); x < canvas.width; x += 100) {
    ctx.beginPath();
    ctx.moveTo(x, CONFIG.GROUND_Y);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
}

function updateUI() {
  scoreEl.textContent = Math.floor(state.score);
  highScoreEl.textContent = state.highScore;
}

// ───────────────────────────────────────────────
// MAIN LOOP
// ───────────────────────────────────────────────
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (state.gameOver) {
    drawBackground();
    player.draw(ctx);
    obstacles.forEach(o => o.draw(ctx));
    gameOverEl.style.display = 'block';
    restartBtn.style.display = 'inline-block';
  } else {
    if (state.started) {
      state.score += 0.25;
      state.gameSpeed += CONFIG.SPEED_INCREASE;
      state.frameCount++;
      player.update();
      spawnObstacle();
      updateObstacles();
      groundX -= state.gameSpeed * 0.7;
    }

    drawBackground();
    player.draw(ctx);
    obstacles.forEach(o => o.draw(ctx));
    updateUI();
  }

  requestAnimationFrame(gameLoop);
}

// ───────────────────────────────────────────────
// INPUT & EVENTS
// ───────────────────────────────────────────────
function handleInput(e) {
  if (state.gameOver) return;

  if (e.code === 'Space' || e.code === 'ArrowUp' || e.type === 'touchstart') {
    e.preventDefault();
    if (!state.started) {
      if (!state.countdown) startCountdown();
      return;
    }
    player.jump();
  }
}

metaverseLink.addEventListener('mouseenter', () => playSound(HOVER_SOUND));
metaverseLink.addEventListener('click', () => playSound(CLICK_SOUND));

window.addEventListener('keydown', handleInput);
canvas.addEventListener('touchstart', handleInput);
restartBtn.addEventListener('click', resetGame);

// ───────────────────────────────────────────────
// INIT
// ───────────────────────────────────────────────
resetGame();
gameLoop();
</script>
</body>
</html>
