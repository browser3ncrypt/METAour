<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>METAOUR - Space Runner</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0a0e17;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    color: #00ffea;
  }
  canvas {
    display: block;
    margin: 0 auto;
    image-rendering: pixelated;
  }
  #ui {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    text-shadow: 0 0 10px #00ffea;
    pointer-events: none;
    z-index: 5;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(10,14,23,0.85);
    z-index: 10;
    pointer-events: none;
  }
  #title { font-size: 80px; text-shadow: 0 0 20px #ff2a6d, 0 0 40px #00ffea; margin: 0; }
  #subtitle { font-size: 32px; margin: 10px 0 30px; text-shadow: 0 0 15px #00ffea; }
  #countdown { font-size: 120px; font-weight: bold; text-shadow: 0 0 30px #ff2a6d; }
  #instructions { font-size: 28px; margin-top: 40px; }
  #game-over {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ff2a6d;
    font-size: 70px;
    text-align: center;
    display: none;
    text-shadow: 0 0 20px #ff2a6d;
    z-index: 15;
  }
  #restart-btn {
    margin-top: 30px;
    padding: 15px 40px;
    font-size: 32px;
    background: transparent;
    border: 4px solid #00ffea;
    color: #00ffea;
    cursor: pointer;
    display: none;
  }
  #restart-btn:hover { background: rgba(0,255,234,0.1); }

  .metaverse-icon {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 20;
    pointer-events: auto;
  }
  .orbit-container {
    position: relative;
    width: 70px;
    height: 70px;
    cursor: pointer;
  }
  .planet {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 25% 25%, #ffffff 8%, transparent 9%),
      radial-gradient(circle at 75% 75%, #00ffea 6%, transparent 7%),
      conic-gradient(#ff2a6d 0deg, #00ffea 100deg, #ff2a6d 200deg, #00ffea 300deg, #ff2a6d 360deg);
    box-shadow: 0 0 12px rgba(0,255,234,0.6);
    animation: orbit 6s linear infinite;
    transition: all 0.2s;
  }
  .orbit-container:hover .planet,
  .orbit-container:active .planet {
    box-shadow: 0 0 20px #00ffea, 0 0 30px rgba(255,42,109,0.4);
    animation-duration: 2s;
    transform: scale(1.1);
  }
  @keyframes orbit {
    to { transform: rotate(360deg) translateX(24px) rotate(-360deg); }
  }
</style>
</head>
<body>

<div id="ui">
  METAOUR • Score: <span id="score">0</span> • High: <span id="high-score">0</span>
</div>

<div class="metaverse-icon">
  <a href="https://cybercat.metaour.com/" target="_blank" title="Warp to METAour Metaverse Cosmos 🚀">
    <div class="orbit-container"><div class="planet"></div></div>
  </a>
</div>

<div id="overlay">
  <h1 id="title">METAOUR</h1>
  <div id="subtitle">SPACE RUNNER</div>
  <div id="countdown">3</div>
  <div id="instructions">PRESS SPACE / TAP TO LAUNCH</div>
</div>

<div id="game-over">
  CRASHED<br/>INTO THE VOID
  <button id="restart-btn">RESTART</button>
</div>

<canvas id="game" width="800" height="300"></canvas>

<script>
// ============================================================================
//  CONFIG
// ============================================================================
const CONFIG = {
  canvas: { width: 800, height: 300 },
  gravity: 0.8,
  jumpForce: -14,
  baseSpeed: 5.5,
  speedIncrease: 0.0045,
  obstacleFreq: 95,
  groundY: 240,
  player: { x: 90, size: 44 },
  obstacle: { size: 42 },
  starLayers: [
    { count: 80,  speed: 0.2, size: [0.8, 1.5], alpha: [0.3, 0.6] },
    { count: 50,  speed: 0.5, size: [1.2, 2.5], alpha: [0.5, 0.8] },
    { count: 30,  speed: 1.0, size: [1.8, 3.5], alpha: [0.7, 1.0] }
  ],
  countdownMs: 3000
};

const COLORS = {
  bg: '#0a0e17',
  ground: '#1a2a44',
  player: '#00ffea',
  meteorFlame: '#ff9500',
  earth: '#2a7fff',
  land: '#228b22',
  cloud: '#f0f8ff',
  obstacleDetail: '#1e90ff',
  stars: '#ffffff',
  text: '#00ffea',
  danger: '#ff2a6d'
};

// ============================================================================
//  AUDIO SYSTEM
// ============================================================================
class AudioManager {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }

  play(notes) {
    this.init();
    notes.forEach((note, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain).connect(this.ctx.destination);
      osc.type = note.type || 'square';
      osc.frequency.value = note.freq;

      const start = this.ctx.currentTime + i * 0.02;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(note.vol || 0.12, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, start + note.dur);

      osc.start(start);
      osc.stop(start + note.dur);
    });
  }
}

const audio = new AudioManager();

const SOUNDS = {
  jump:   [{freq:880, dur:0.08, vol:0.10, type:'triangle'}, {freq:659, dur:0.12, vol:0.08, type:'triangle'}],
  crash:  [{freq:220, dur:0.25, vol:0.20, type:'sawtooth'}, {freq:110, dur:0.30, vol:0.15, type:'sawtooth'}, {freq:55, dur:0.40, vol:0.12, type:'sawtooth'}],
  hover:  [{freq:523, dur:0.08, vol:0.07}, {freq:659, dur:0.08, vol:0.07}, {freq:784, dur:0.12, vol:0.05}],
  click:  [{freq:65,  dur:0.25, vol:0.18, type:'triangle'}, {freq:523, dur:0.15, vol:0.12}, {freq:659, dur:0.15, vol:0.12}, {freq:784, dur:0.22, vol:0.10}]
};

// ============================================================================
//  ENTITIES
// ============================================================================
class Player {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = CONFIG.player.x;
    this.y = CONFIG.groundY - CONFIG.player.size;
    this.vy = 0;
    this.onGround = true;
    this.width = CONFIG.player.size;
    this.height = CONFIG.player.size;
  }

  jump() {
    if (this.onGround) {
      this.vy = CONFIG.jumpForce;
      this.onGround = false;
      audio.play(SOUNDS.jump);
    }
  }

  update() {
    this.vy += CONFIG.gravity;
    this.y += this.vy;

    if (this.y >= CONFIG.groundY - this.height) {
      this.y = CONFIG.groundY - this.height;
      this.vy = 0;
      this.onGround = true;
    }
  }

  draw(ctx) {
    // Meteor body (fiery oval)
    ctx.fillStyle = '#ff4500';
    ctx.beginPath();
    ctx.ellipse(this.x + 22, this.y + 22, 22, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // Core glow
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.ellipse(this.x + 22, this.y + 18, 14, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Flame trail
    ctx.fillStyle = COLORS.meteorFlame;
    ctx.fillRect(this.x + 10, this.y + 28, 24, 18 + Math.random()*6);
    ctx.fillStyle = 'rgba(255, 165, 0, 0.6)';
    ctx.fillRect(this.x + 14, this.y + 32, 16, 22 + Math.random()*8);
  }
}

class EarthObstacle {
  constructor(x) {
    this.x = x;
    this.y = CONFIG.groundY - CONFIG.obstacle.size;
    this.width = CONFIG.obstacle.size * 0.9;
    this.height = CONFIG.obstacle.size;
  }

  update() {
    this.x -= state.gameSpeed;
  }

  draw(ctx) {
    const cx = this.x + this.width/2;
    const cy = this.y + this.height/2;
    const r = this.width / 2;

    // Blue ocean base
    ctx.fillStyle = COLORS.earth;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // Green continents (simple stylized shapes)
    ctx.fillStyle = COLORS.land;
    ctx.beginPath();
    ctx.moveTo(cx - r*0.4, cy - r*0.3);
    ctx.quadraticCurveTo(cx - r*0.7, cy - r*0.6, cx - r*0.5, cy);
    ctx.quadraticCurveTo(cx - r*0.6, cy + r*0.4, cx - r*0.2, cy + r*0.5);
    ctx.quadraticCurveTo(cx + r*0.3, cy + r*0.6, cx + r*0.5, cy + r*0.2);
    ctx.quadraticCurveTo(cx + r*0.6, cy - r*0.2, cx + r*0.4, cy - r*0.5);
    ctx.closePath();
    ctx.fill();

    // White clouds
    ctx.fillStyle = COLORS.cloud;
    ctx.globalAlpha = 0.7;
    for (let i = 0; i < 3; i++) {
      const ox = cx + (Math.sin(i*2.1) * r * 0.6);
      const oy = cy + (Math.cos(i*2.1) * r * 0.5);
      ctx.beginPath();
      ctx.arc(ox, oy, r*0.25, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Atmosphere glow
    ctx.strokeStyle = 'rgba(100, 180, 255, 0.4)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
    ctx.stroke();
  }

  isOffScreen() {
    return this.x + this.width < 0;
  }
}

class ParallaxStar {
  constructor(layer) {
    this.layer = layer;
    this.reset();
  }

  reset() {
    this.x = Math.random() * (CONFIG.canvas.width + 200) - 100;
    this.y = Math.random() * CONFIG.canvas.height * 0.9;
    this.size = Math.random() * (this.layer.size[1] - this.layer.size[0]) + this.layer.size[0];
    this.baseAlpha = Math.random() * (this.layer.alpha[1] - this.layer.alpha[0]) + this.layer.alpha[0];
    this.twinkle = Math.random() * Math.PI * 2;
  }

  update() {
    this.x -= state.gameSpeed * this.layer.speed;
    if (this.x < -this.size * 2) {
      this.reset();
      this.x = CONFIG.canvas.width + this.size * 2 + Math.random() * 100;
    }
  }

  draw(ctx) {
    const alpha = this.baseAlpha * (Math.sin(state.frameCount * 0.08 + this.twinkle) * 0.3 + 0.7);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = COLORS.stars;
    ctx.fillRect(this.x, this.y, this.size, this.size);
    ctx.globalAlpha = 1;
  }
}

// ============================================================================
//  GAME STATE & SYSTEMS
// ============================================================================
const state = {
  score: 0,
  highScore: parseInt(localStorage.getItem('metaourHighScore') || '0'),
  gameSpeed: CONFIG.baseSpeed,
  frameCount: 0,
  gameOver: false,
  started: false,
  countdown: null
};

const elements = {
  canvas: document.getElementById('game'),
  ctx: null,
  score: document.getElementById('score'),
  highScore: document.getElementById('high-score'),
  overlay: document.getElementById('overlay'),
  countdown: document.getElementById('countdown'),
  gameOver: document.getElementById('game-over'),
  restartBtn: document.getElementById('restart-btn'),
  metaverseLink: document.querySelector('.metaverse-icon a')
};

elements.ctx = elements.canvas.getContext('2d');

let player = new Player();
let obstacles = [];
let stars = [];

// ============================================================================
//  GAME SYSTEMS
// ============================================================================
const Background = {
  draw() {
    const ctx = elements.ctx;
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

    stars.forEach(star => {
      star.update();
      star.draw(ctx);
    });

    ctx.fillStyle = COLORS.ground;
    ctx.fillRect(0, CONFIG.groundY, CONFIG.canvas.width, CONFIG.canvas.height - CONFIG.groundY);

    ctx.strokeStyle = 'rgba(0, 255, 234, 0.12)';
    ctx.lineWidth = 1;
    for (let x = (state.frameCount * -state.gameSpeed * 0.7 % 100); x < CONFIG.canvas.width; x += 100) {
      ctx.beginPath();
      ctx.moveTo(x, CONFIG.groundY);
      ctx.lineTo(x, CONFIG.canvas.height);
      ctx.stroke();
    }
  }
};

const Entities = {
  update() {
    player.update();

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.update();
      if (obs.isOffScreen()) {
        obstacles.splice(i, 1);
      } else if (this.checkCollision(player, obs)) {
        state.gameOver = true;
        audio.play(SOUNDS.crash);
        if (Math.floor(state.score) > state.highScore) {
          state.highScore = Math.floor(state.score);
          localStorage.setItem('metaourHighScore', state.highScore);
        }
      }
    }
  },

  draw() {
    player.draw(elements.ctx);
    obstacles.forEach(o => o.draw(elements.ctx));
  },

  checkCollision(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }
};

const Spawner = {
  trySpawn() {
    if (state.frameCount % CONFIG.obstacleFreq === 0 && Math.random() > 0.2) {
      obstacles.push(new EarthObstacle(CONFIG.canvas.width + 80));
    }
  }
};

const UI = {
  update() {
    elements.score.textContent = Math.floor(state.score);
    elements.highScore.textContent = state.highScore;
  }
};

// ============================================================================
//  GAME FLOW
// ============================================================================
function resetGame() {
  state.score = 0;
  state.gameSpeed = CONFIG.baseSpeed;
  state.frameCount = 0;
  state.gameOver = false;
  state.started = false;
  state.countdown = null;

  player.reset();
  obstacles = [];
  stars = [];

  CONFIG.starLayers.forEach(layer => {
    for (let i = 0; i < layer.count; i++) {
      stars.push(new ParallaxStar(layer));
    }
  });

  elements.overlay.style.display = 'flex';
  elements.countdown.textContent = '3';
  elements.gameOver.style.display = 'none';
  elements.restartBtn.style.display = 'none';

  UI.update();
}

function startCountdown() {
  if (state.countdown) return;
  state.countdown = Date.now() + CONFIG.countdownMs;
  let num = 3;
  const id = setInterval(() => {
    num--;
    elements.countdown.textContent = num > 0 ? num : 'LAUNCH!';
    if (num <= 0) {
      clearInterval(id);
      setTimeout(() => {
        elements.overlay.style.display = 'none';
        state.started = true;
      }, 800);
    }
  }, 1000);
}

function gameLoop() {
  const ctx = elements.ctx;
  ctx.clearRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

  if (state.gameOver) {
    Background.draw();
    Entities.draw();
    elements.gameOver.style.display = 'block';
    elements.restartBtn.style.display = 'inline-block';
  } else {
    if (state.started) {
      state.score += 0.25;
      state.gameSpeed += CONFIG.speedIncrease;
      state.frameCount++;

      Entities.update();
      Spawner.trySpawn();
      UI.update();
    }

    Background.draw();
    Entities.draw();
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================================
//  INPUT
// ============================================================================
function handleInput(e) {
  if (state.gameOver) return;

  if (e.code === 'Space' || e.code === 'ArrowUp' || e.type === 'touchstart') {
    e.preventDefault();
    if (!state.started) {
      if (!state.countdown) startCountdown();
      return;
    }
    player.jump();
  }
}

// ============================================================================
//  INIT & EVENT BINDING
// ============================================================================
elements.metaverseLink.addEventListener('mouseenter', () => audio.play(SOUNDS.hover));
elements.metaverseLink.addEventListener('click',     () => audio.play(SOUNDS.click));

window.addEventListener('keydown', handleInput);
elements.canvas.addEventListener('touchstart', handleInput);
elements.restartBtn.addEventListener('click', resetGame);

// Start
resetGame();
gameLoop();
</script>
</body>
</html>
